name: PFE-RA Solver Verification

on:
  pull_request:
    branches: [main]
    paths:
      - "research/pfe-ra/**"
      - ".github/workflows/pfe-ra.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pfe-ra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  solver-verification:
    name: CP-SAT optimality and reproducible benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: research/pfe-ra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/pfe-ra/pyproject.toml
      - name: Install PFE-RA and OR-Tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Prove small-case optima against exhaustive enumeration
        run: python -m pytest -q
      - name: Run deterministic benchmarks
        run: python -m pfera.benchmark --output results --sizes 8,16 --seeds 7,17 --time-limit 10
      - name: Reject missing solver runs or invalid solutions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows = json.loads(Path("results/benchmark_results.json").read_text())["results"]
          solver_rows = [row for row in rows if row["algorithm"] == "pfe_ra"]
          assert solver_rows, "no PFE-RA benchmark records were produced"
          assert all(row["status"] == "OPTIMAL" for row in solver_rows), solver_rows
          assert all(not row.get("validation_errors") for row in solver_rows), solver_rows
          print(f"Verified {len(solver_rows)} optimal PFE-RA benchmark runs.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pfe-ra-benchmark-results
          path: |
            research/pfe-ra/results/benchmark_results.csv
            research/pfe-ra/results/benchmark_results.json
