[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hostel-management-system"
version = "2.0.0"
description = "A modern, open-source hostel management system with a CLI and a web dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aashish Bharti", email = "aashish@marketdoctorsonline.com" }]
keywords = ["hostel", "management", "flask", "education", "dashboard", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Framework :: Flask",
]
dependencies = ["Flask>=3.0,<4.0", "python-dotenv>=1.0"]

[project.optional-dependencies]
mysql = ["mysql-connector-python>=8.3"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/aashishbharti04/Hostel-Management-System"
Repository = "https://github.com/aashishbharti04/Hostel-Management-System"
Issues = "https://github.com/aashishbharti04/Hostel-Management-System/issues"

[project.scripts]
hms-cli = "hostel_management.cli:main"

[tool.setuptools.packages.find]
include = ["hostel_management*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
